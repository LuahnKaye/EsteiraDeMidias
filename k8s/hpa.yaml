apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-api-hpa
  namespace: esteira-midias
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-worker-hpa
  namespace: esteira-midias
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
